
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Warehouse Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .chat-container {
            max-width: 900px;
            margin: 35px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .chat-header {
            background: #172554;
            color: white;
            padding: 22px;
        }

        #chat-box {
            height: 480px;
            overflow-y: auto;
            padding: 25px;
        }

        .message-wrapper {
            margin-bottom: 18px;
        }

        .message {
            display: inline-block;
            max-width: 80%;
            padding: 13px 17px;
            border-radius: 13px;
            white-space: pre-wrap;
        }

        .bot {
            background: #e2e8f0;
            color: #172554;
        }

        .user {
            background: #2563eb;
            color: white;
            float: right;
        }

        .timestamp {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
        }

        .user-wrapper {
            text-align: right;
            clear: both;
        }

        .bot-wrapper {
            text-align: left;
            clear: both;
        }

        .typing {
            color: #64748b;
            font-style: italic;
            padding: 10px 25px;
        }

        .chat-input {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <h3>🤖 AI Warehouse Assistant</h3>
        <small>Smart inventory management assistant</small>
    </div>

    <div id="chat-box">

        <div class="message-wrapper bot-wrapper">
            <div class="message bot">
                Hello! Welcome to your Warehouse Assistant.

                You can ask me about:
                • Products
                • Stock quantity
                • Low stock
                • Suppliers
                • Warehouses
            </div>
            <span class="timestamp">Assistant</span>
        </div>

    </div>

    <div id="typing" class="typing" style="display:none;">
        Assistant is typing...
    </div>

    <div class="chat-input">
        <div class="input-group">
            <input
                type="text"
                id="user-message"
                class="form-control"
                placeholder="Ask your warehouse question..."
            >

            <button
                id="send-button"
                class="btn btn-primary"
                onclick="sendMessage()"
            >
                Send
            </button>
        </div>
    </div>

</div>

<script>

const chatBox = document.getElementById("chat-box");
const messageInput = document.getElementById("user-message");
const sendButton = document.getElementById("send-button");
const typing = document.getElementById("typing");

function addMessage(message, sender) {

    const wrapper = document.createElement("div");

    wrapper.className = sender === "user"
        ? "message-wrapper user-wrapper"
        : "message-wrapper bot-wrapper";

    const bubble = document.createElement("div");
    bubble.className = "message " + sender;
    bubble.textContent = message;

    const time = document.createElement("span");
    time.className = "timestamp";
    time.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    wrapper.appendChild(bubble);
    wrapper.appendChild(time);

    chatBox.appendChild(wrapper);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    messageInput.value = "";
    sendButton.disabled = true;
    typing.style.display = "block";

    try {

        const response = await fetch("/chatbot/chat/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.answer || "Request failed.");
        }

        addMessage(data.answer, "bot");

    } catch (error) {

        addMessage(
            error.message || "Unable to connect to chatbot.",
            "bot"
        );

    } finally {

        typing.style.display = "none";
        sendButton.disabled = false;
        messageInput.focus();

    }
}

messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
